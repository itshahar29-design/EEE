<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktiv Darslar & Masterclass | FrontCraft Pro</title>
  <meta name="description" content="278+ dan ortiq frontend masterclass darslari, interaktiv namuna va amaliy mashqlar">
  <meta name="theme-color" content="#0284c7">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./images/icon-192.png" type="image/png">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-theme="dark">

  <!-- TOP NAVBAR -->
  <header class="top-navbar" role="banner">
    <a href="./index.html" class="brand-wrapper" style="text-decoration:none;">
      <div class="brand-icon" aria-hidden="true">
        <i class="fa-solid fa-code"></i>
      </div>
      <div class="brand-titles">
        <h1 data-i18n="siteTitle">FrontCraft Pro</h1>
        <p data-i18n="siteSubtitle">Interaktiv Darslar Markazi</p>
      </div>
    </a>

    <!-- ASOSIY SAHIFALAR TOGGLE NAVIGATSIYASI -->
    <nav class="main-page-nav" role="navigation" aria-label="Sahifalar">
      <a href="./index.html" class="page-nav-btn" style="text-decoration:none;">
        <i class="fa-solid fa-house"></i> <span>Bosh Sahifa</span>
      </a>
      <a href="./projects.html" class="page-nav-btn" style="text-decoration:none;">
        <i class="fa-solid fa-cubes"></i> <span>Tayyor Loyihalar (200+)</span>
      </a>
      <a href="./lessons.html" class="page-nav-btn active" style="text-decoration:none;">
        <i class="fa-solid fa-graduation-cap"></i> <span>Interaktiv Darslar (278+)</span>
      </a>
    </nav>

    <!-- O'ng Tomon Amallari -->
    <div class="nav-actions">
      <!-- 3 Tilli Tanlov -->
      <select id="langSelect" class="lang-select" aria-label="Tilni tanlang">
        <option value="uz">🇺🇿 O'zbek</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="en">🇬🇧 English</option>
      </select>

      <!-- Dark / Light Rejim -->
      <button id="themeToggleBtn" class="nav-btn icon-btn" aria-label="Mavzuni almashtirish">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- ========================================================
       DARSLAR SAHIFASI (DEDICATED FULL-SCREEN WORKSPACE)
       ======================================================== -->
  <div class="lessons-page-layout">
    <!-- Chap Darslar Daraxti va Filtrlari -->
    <aside class="lessons-sidebar" role="navigation" aria-label="Darslar ro'yxati">
      <div class="lessons-sidebar-header">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h3 style="font-size: 1rem; font-weight: 700; color:var(--text-main);">
            <i class="fa-solid fa-graduation-cap" style="color:var(--accent);"></i> Kurs Modullari
          </h3>
          <div style="display:flex; align-items:center; gap:8px;">
            <span id="lessonsTotalBadge" class="module-count">278 dars</span>
            <button id="closeLessonsDrawerBtn" class="drawer-close-btn" aria-label="Yopish">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <!-- Darslar ichidan tezkor qidiruv -->
        <div style="position:relative; margin-bottom:12px;">
          <input 
            type="text" 
            id="lessonSearchInput" 
            placeholder="Darsni qidirish..." 
            style="width:100%; padding:8px 12px 8px 32px; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; color:var(--text-main); font-size:0.85rem; outline:none;"
          >
          <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:0.8rem; color:var(--text-muted);"></i>
        </div>

        <!-- Progress Box -->
        <div class="lessons-progress-box">
          <div style="display: flex; justify-content: space-between;">
            <span>O'zlashtirish darajasi:</span>
            <strong id="lessonsProgressPercent">0%</strong>
          </div>
          <div class="lessons-progress-track">
            <div id="lessonsProgressBar" class="lessons-progress-fill"></div>
          </div>
        </div>
      </div>

      <!-- Modullar va Darslar daraxti -->
      <div class="lessons-tree" id="lessonsTreeContainer">
        <div style="text-align:center; padding:30px 10px; color:var(--text-muted);">
          <i class="fa-solid fa-spinner fa-spin" style="font-size:24px; margin-bottom:8px;"></i>
          <p>Darslar yuklanmoqda...</p>
        </div>
      </div>
    </aside>

    <!-- MOBILE DRAWER BACKDROP -->
    <div id="lessonsSidebarBackdrop" class="drawer-backdrop"></div>

    <!-- O'ng Dars Maydoni (Workspace) -->
    <main class="lesson-workspace">
      <div class="lesson-top-bar">
        <div style="display:flex; align-items:center; gap:12px; flex:1; min-width:0;">
          <button id="mobileLessonsToggleBtn" class="mobile-drawer-btn" aria-label="Darslar ro'yxatini ochish">
            <i class="fa-solid fa-list-ul"></i> <span>Darslar</span>
          </button>
          <div class="lesson-title-area" style="min-width:0;">
            <h2 id="lessonCurrentTitle">1-dars. HTML Kirish</h2>
            <p id="lessonCurrentModule">01. HTML5 Asoslari</p>
          </div>
        </div>
        <div class="lesson-top-actions" style="display: flex; gap: 8px; flex-wrap:wrap;">
          <button id="lessonCompleteBtn" class="nav-btn" style="color: var(--success);">
            <i class="fa-solid fa-circle-check"></i> <span id="lessonCompleteText">Darsni yakunlash</span>
          </button>
          <button id="lessonDownloadBtn" class="nav-btn active">
            <i class="fa-solid fa-download"></i> ZIP Yuklab Olish
          </button>
        </div>
      </div>

      <!-- Dars Tablari -->
      <div class="lesson-workspace-tabs" role="tablist">
        <button class="lesson-tab-btn active" data-lesson-tab="preview" role="tab"><i class="fa-solid fa-play"></i> Jonli Namuna</button>
        <button class="lesson-tab-btn" data-lesson-tab="code" role="tab"><i class="fa-solid fa-code"></i> Kod</button>
        <button class="lesson-tab-btn" data-lesson-tab="theory" role="tab"><i class="fa-solid fa-book-open"></i> Tushuntirish</button>
        <button class="lesson-tab-btn" data-lesson-tab="exercise" role="tab"><i class="fa-solid fa-dumbbell"></i> Mashq</button>
      </div>

      <!-- Dars Tab Panellari -->
      <div id="lessonTab-preview" class="lesson-view-pane active">
        <iframe id="lessonPreviewFrame" class="lesson-preview-frame" src="about:blank"></iframe>
      </div>

      <div id="lessonTab-code" class="lesson-view-pane">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap:wrap;">
          <div class="code-file-tabs" id="lessonCodeFileTabs" style="display: flex; gap: 8px; flex-wrap:wrap;"></div>
          <button id="lessonCopyCodeBtn" class="nav-btn">
            <i class="fa-solid fa-copy"></i> Kodni nusxalash
          </button>
        </div>
        <pre id="lessonCodeViewer" class="code-display-pre"></pre>
      </div>

      <div id="lessonTab-theory" class="lesson-view-pane">
        <div class="lesson-section-card" id="lessonTheoryCard">
          <!-- lessons.js to'ldiradi -->
        </div>
      </div>

      <div id="lessonTab-exercise" class="lesson-view-pane">
        <div class="lesson-section-card" id="lessonExerciseCard">
          <!-- lessons.js to'ldiradi -->
        </div>
      </div>
    </main>
  </div>

  <!-- TOAST BILDIRISHNOMA -->
  <div id="toastMsg" class="toast-msg" role="status" aria-live="polite"></div>

  <!-- SCRIPTS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="./lessons.js"></script>
</body>
</html>
