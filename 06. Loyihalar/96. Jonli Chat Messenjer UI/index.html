</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>

<div class="card" style="max-width:550px;margin:0 auto;height:450px;display:flex;flex-direction:column;"><div id="chat-box" style="flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px;"><div style="align-self:flex-start;background:#0f172a;padding:10px 14px;border-radius:12px;">Salom! Loyiha tayyormi?</div><div style="align-self:flex-end;background:#0284c7;color:white;padding:10px 14px;border-radius:12px;">Ha, 100 ta loyiha tayyor bo'ldi! 🚀</div></div><div style="display:flex;gap:10px;margin-top:10px;"><input id="chat-in" placeholder="Xabar..." style="flex:1;padding:10px;background:#090d16;border:1px solid #334155;border-radius:6px;color:white;"><button class="btn btn-success" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button></div></div>
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Chat Messenger UI</strong></p>
    </footer>

    <script src="./script.js"></script>
