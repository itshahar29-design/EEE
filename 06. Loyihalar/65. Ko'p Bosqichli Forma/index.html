<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form - Bosqichli Forma | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Multi-Step Form - Bosqichli Forma</h1>
            <p class="project-badge"><i class="fa-solid fa-palette"></i> Dizayn & UI Asboblari</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <div id="step-1" class="form-step">
            <h3 style="color: #38bdf8; margin-bottom: 15px;">1-Qadam: Shaxsiy ma'lumotlar</h3>
            <input type="text" placeholder="Ismingiz..." style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 15px;">
            <button class="btn btn-success" onclick="goStep(2)">Keyingisi</button>
        </div>
        <div id="step-2" class="form-step" style="display: none;">
            <h3 style="color: #38bdf8; margin-bottom: 15px;">2-Qadam: Aloqa</h3>
            <input type="email" placeholder="Emailingiz..." style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 15px;">
            <button class="btn btn-secondary" onclick="goStep(1)">Orqaga</button>
            <button class="btn btn-success" onclick="alert('Ro'yxatdan o'tdingiz!')">Yuborish</button>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Multi-Step Form - Bosqichli Forma</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
