<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Nuqtali Border-Radius Generatori | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>8-Nuqtali Border-Radius Generatori</h1>
            <p class="project-badge"><i class="fa-solid fa-palette"></i> Dizayn & UI Asboblari</p>
        </div>
    </header>

    <main class="project-main">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
        <div class="card">
            <label style="color: #94a3b8;">Radius qiymatlari (0 - 100%):</label>
            <input type="range" id="br-1" min="0" max="100" value="60" style="width: 100%; margin: 8px 0 12px;">
            <input type="range" id="br-2" min="0" max="100" value="40" style="width: 100%; margin: 8px 0 12px;">
            <input type="range" id="br-3" min="0" max="100" value="30" style="width: 100%; margin: 8px 0 12px;">
            <input type="range" id="br-4" min="0" max="100" value="70" style="width: 100%; margin: 8px 0 12px;">
        </div>
        <div class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div id="br-box" style="width: 180px; height: 180px; background: linear-gradient(135deg, #a855f7, #ec4899); margin-bottom: 25px; transition: border-radius 0.2s;"></div>
            <input type="text" id="br-code" readonly style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: #38bdf8; font-family: monospace; text-align: center;">
            <button class="btn btn-success" style="margin-top: 15px;" onclick="navigator.clipboard.writeText(document.getElementById('br-code').value); alert('Nusxalandi!');"><i class="fa-solid fa-copy"></i> Nusxa Olish</button>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>8-Nuqtali Border-Radius Generatori</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
