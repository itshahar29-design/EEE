<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Kodlovchi va Dekodlovchi | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Base64 Kodlovchi va Dekodlovchi</h1>
            <p class="project-badge"><i class="fa-solid fa-code"></i> Dasturchi Asboblari</p>
        </div>
    </header>

    <main class="project-main">
<div class="card"><textarea id="b64-in" style="width:100%;height:120px;background:#090d16;color:white;padding:10px;border-radius:6px;border:1px solid #334155;" placeholder="Matn..."></textarea><div style="margin:10px 0;display:flex;gap:10px;"><button class="btn btn-success" onclick="document.getElementById('b64-out').value=btoa(document.getElementById('b64-in').value)">Kodlash (Encode)</button><button class="btn" onclick="document.getElementById('b64-out').value=atob(document.getElementById('b64-in').value)">Dekodlash (Decode)</button></div><textarea id="b64-out" readonly style="width:100%;height:120px;background:#090d16;color:#38bdf8;padding:10px;border-radius:6px;border:1px solid #334155;" placeholder="Natija..."></textarea></div>
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Base64 Kodlovchi va Dekodlovchi</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
