<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Pretty Print & Validator | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>JSON Pretty Print & Validator</h1>
            <p class="project-badge"><i class="fa-solid fa-code"></i> Dasturchi Asboblari</p>
        </div>
    </header>

    <main class="project-main">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div>
            <textarea id="json-in" placeholder="Bu yerga xom JSON kiriting..." style="width: 100%; height: 380px; padding: 15px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-family: monospace; outline: none; resize: none;">{"status":"ok","code":200,"data":{"user":"Developer","skills":["HTML","CSS","JS","React"]}}</textarea>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button class="btn btn-success" onclick="formatJSON()"><i class="fa-solid fa-wand-magic-sparkles"></i> Formatlash</button>
                <button class="btn" onclick="minifyJSON()"><i class="fa-solid fa-compress"></i> Siqish (Minify)</button>
            </div>
        </div>
        <div>
            <textarea id="json-out" readonly style="width: 100%; height: 380px; padding: 15px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: #38bdf8; font-family: monospace; outline: none; resize: none;"></textarea>
            <p id="json-status" style="margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>JSON Pretty Print & Validator</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
