<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole - Mole Tutish O'yini | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Whack-a-Mole - Mole Tutish O'yini</h1>
            <p class="project-badge"><i class="fa-solid fa-gamepad"></i> O'yin & Interaktiv</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
        <div style="display: flex; justify-content: space-around; margin-bottom: 20px;">
            <p>Vaqt: <strong id="mole-time" style="color: #ef4444;">30s</strong></p>
            <p>Ball: <strong id="mole-score" style="color: #10b981;">0</strong></p>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px;">
            <div class="mole-hole" onclick="hitMole(0)"></div>
            <div class="mole-hole" onclick="hitMole(1)"></div>
            <div class="mole-hole" onclick="hitMole(2)"></div>
            <div class="mole-hole" onclick="hitMole(3)"></div>
            <div class="mole-hole" onclick="hitMole(4)"></div>
            <div class="mole-hole" onclick="hitMole(5)"></div>
        </div>
        <button class="btn btn-success" onclick="startMole()"><i class="fa-solid fa-play"></i> O'yinni Boshlash</button>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Whack-a-Mole - Mole Tutish O'yini</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
