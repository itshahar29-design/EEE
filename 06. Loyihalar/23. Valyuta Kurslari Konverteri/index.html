<!DOCTYPE html>
<html lang="uz">
<head>

<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Valyuta Konverteri (UZS / USD / EUR)</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
        <input type="number" id="curr-amount" value="100" style="width: 100%; padding: 12px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 18px; margin-bottom: 15px;">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <select id="curr-from" style="flex: 1; padding: 12px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: white;">
                <option value="USD">USD ($)</option>
                <option value="UZS">UZS (so'm)</option>
                <option value="EUR">EUR (€)</option>
            </select>
            <span style="display: flex; align-items: center; color: #38bdf8; font-size: 20px;">➡️</span>
            <select id="curr-to" style="flex: 1; padding: 12px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: white;">
                <option value="UZS">UZS (so'm)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
            </select>
        </div>
        <button class="btn btn-success" style="width: 100%; justify-content: center;" onclick="calcCurr()">Hisoblash</button>
        <div style="margin-top: 25px; background: #0f172a; padding: 20px; border-radius: 8px;">
            <h2 id="curr-result" style="color: #10b981; font-size: 28px;">1,270,000 UZS</h2>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
