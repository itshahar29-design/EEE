<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Birliklar Konverteri | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Universal Birliklar Konverteri</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 550px; margin: 0 auto; text-align: center;">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="number" id="unit-val" value="1" style="flex: 1; padding: 12px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 16px;">
            <select id="unit-from" style="padding: 12px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: white;">
                <option value="m">Metr (m)</option>
                <option value="km">Kilometr (km)</option>
                <option value="cm">Santimetr (cm)</option>
                <option value="mi">Mil (mile)</option>
            </select>
        </div>
        <p style="color: #38bdf8; font-size: 24px; margin-bottom: 20px;">⬇️ Teng keladi ⬇️</p>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="unit-res" readonly style="flex: 1; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #10b981; font-size: 18px; font-weight: bold;">
            <select id="unit-to" style="padding: 12px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: white;">
                <option value="km">Kilometr (km)</option>
                <option value="m">Metr (m)</option>
                <option value="cm">Santimetr (cm)</option>
                <option value="mi">Mil (mile)</option>
            </select>
        </div>
        <button class="btn btn-success" onclick="convertUnit()"><i class="fa-solid fa-arrows-rotate"></i> O'girish</button>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Universal Birliklar Konverteri</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
