<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table - Oylik / Yillik Reja | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Pricing Table - Oylik / Yillik Reja</h1>
            <p class="project-badge"><i class="fa-solid fa-palette"></i> Dizayn & UI Asboblari</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 700px; margin: 0 auto; text-align: center;">
        <div style="margin-bottom: 25px;">
            <button class="btn btn-secondary active" id="pr-m" onclick="togglePrice(false)">Oylik</button>
            <button class="btn btn-secondary" id="pr-y" onclick="togglePrice(true)">Yillik (-20%)</button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div style="background: #0f172a; padding: 25px; border-radius: 10px; border: 1px solid #334155;">
                <h3>Boshlang'ich</h3>
                <h1 id="price-1" style="color: #38bdf8; margin: 15px 0;">$10 / oy</h1>
                <p style="color: #94a3b8; font-size: 14px;">Barcha asosiy imkoniyatlar</p>
            </div>
            <div style="background: #0f172a; padding: 25px; border-radius: 10px; border: 2px solid #38bdf8;">
                <h3>Pro Plan</h3>
                <h1 id="price-2" style="color: #10b981; margin: 15px 0;">$25 / oy</h1>
                <p style="color: #94a3b8; font-size: 14px;">Cheksiz yuklanmalar va yordam</p>
            </div>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Pricing Table - Oylik / Yillik Reja</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
