<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test - Tezkor Yozish Mashqi | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Typing Speed Test - Tezkor Yozish Mashqi</h1>
            <p class="project-badge"><i class="fa-solid fa-gamepad"></i> O'yin & Interaktiv</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 700px; margin: 0 auto; text-align: center;">
        <div style="background: #0f172a; padding: 20px; border-radius: 8px; margin-bottom: 20px; font-size: 18px; line-height: 1.6; color: #38bdf8;" id="sample-text">
            JavaScript dasturlash tili zamonaviy veb saytlarni dinamik va interaktiv qilish uchun ishlatiladi.
        </div>
        <textarea id="typing-input" placeholder="Yuqoridagi matnni shu yerga yozishni boshlang..." style="width: 100%; height: 120px; padding: 15px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 16px; outline: none; margin-bottom: 20px;"></textarea>
        <div style="display: flex; justify-content: space-around; font-size: 18px;">
            <p>Vaqt: <strong id="type-time" style="color: #ec4899;">0s</strong></p>
            <p>Tezlik (WPM): <strong id="type-wpm" style="color: #10b981;">0</strong></p>
            <p>Aniqlik: <strong id="type-acc" style="color: #f59e0b;">100%</strong></p>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Typing Speed Test - Tezkor Yozish Mashqi</strong></p>
    </footer>

    <script src="./script.js"></script>
