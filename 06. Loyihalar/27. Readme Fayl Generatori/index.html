<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub README.md Generatori | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>GitHub README.md Generatori</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 750px; margin: 0 auto;">
        <input type="text" id="rm-title" placeholder="Loyiha nomi (Masalan: E-Commerce Store)" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 12px;">
        <textarea id="rm-desc" placeholder="Loyiha tavsifi..." style="width: 100%; height: 80px; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 12px;"></textarea>
        <input type="text" id="rm-install" placeholder="Ishga tushirish buyrug'i (Masalan: npm start)" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 15px;">
        <button class="btn btn-success" onclick="genReadme()"><i class="fa-solid fa-code"></i> Generatsiya Qilish</button>
        <div style="margin-top: 20px;">
            <textarea id="rm-result" readonly style="width: 100%; height: 200px; padding: 15px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: #38bdf8; font-family: monospace;"></textarea>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>GitHub README.md Generatori</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
