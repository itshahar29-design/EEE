<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rich Text Editor - Matn Muharriri | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Rich Text Editor - Matn Muharriri</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card editor-card">
        <div class="editor-toolbar">
            <button class="tool-btn" onclick="formatDoc('bold')" title="Qalin"><i class="fa-solid fa-bold"></i></button>
            <button class="tool-btn" onclick="formatDoc('italic')" title="Qiya"><i class="fa-solid fa-italic"></i></button>
            <button class="tool-btn" onclick="formatDoc('underline')" title="Tagiga chizilgan"><i class="fa-solid fa-underline"></i></button>
            <button class="tool-btn" onclick="formatDoc('insertUnorderedList')" title="Nuqtali ro'yxat"><i class="fa-solid fa-list-ul"></i></button>
            <button class="tool-btn" onclick="formatDoc('insertOrderedList')" title="Raqamli ro'yxat"><i class="fa-solid fa-list-ol"></i></button>
            <button class="tool-btn" onclick="formatDoc('justifyLeft')" title="Chapga"><i class="fa-solid fa-align-left"></i></button>
            <button class="tool-btn" onclick="formatDoc('justifyCenter')" title="O'rtaga"><i class="fa-solid fa-align-center"></i></button>
            <button class="tool-btn" onclick="formatDoc('justifyRight')" title="O'ngga"><i class="fa-solid fa-align-right"></i></button>
            <button class="btn btn-success" style="padding: 6px 12px; margin-left: auto;" onclick="downloadTxt()"><i class="fa-solid fa-download"></i> Yuklash</button>
        </div>
        <div id="editor-body" class="editor-body" contenteditable="true">
            <h2>Front-End Dasturchilar uchun Matn Muharriri</h2>
            <p>Bu yerga istalgan matningizni yozishingiz, formatlashingiz va nusxalab olishingiz mumkin.</p>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Rich Text Editor - Matn Muharriri</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
