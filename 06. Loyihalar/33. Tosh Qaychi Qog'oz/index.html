<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tosh Qaychi Qog'oz O'yini | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Tosh Qaychi Qog'oz O'yini</h1>
            <p class="project-badge"><i class="fa-solid fa-gamepad"></i> O'yin & Interaktiv</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 550px; margin: 0 auto; text-align: center;">
        <div style="display: flex; justify-content: space-around; margin-bottom: 25px; font-size: 18px;">
            <p>Siz: <strong id="rps-user" style="color: #10b981;">0</strong></p>
            <p>Kompyuter: <strong id="rps-comp" style="color: #ef4444;">0</strong></p>
        </div>
        <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 25px;">
            <button class="rps-btn" onclick="playRPS('✊')">✊<br><small>Tosh</small></button>
            <button class="rps-btn" onclick="playRPS('✂️')">✂️<br><small>Qaychi</small></button>
            <button class="rps-btn" onclick="playRPS('📄')">📄<br><small>Qog'oz</small></button>
        </div>
        <div id="rps-res" style="background: #0f172a; padding: 20px; border-radius: 8px;">
            <p style="color: #94a3b8;">Tanlovni bosing!</p>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Tosh Qaychi Qog'oz O'yini</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
