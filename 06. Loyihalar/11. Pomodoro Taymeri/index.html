<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Ish Vaqti Taymeri | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Pomodoro Ish Vaqti Taymeri</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card pomodoro-card">
        <div class="timer-mode">
            <button class="mode-btn active" data-time="1500">Fokus (25 daqiqa)</button>
            <button class="mode-btn" data-time="300">Qisqa Tanaffus (5 daqiqa)</button>
            <button class="mode-btn" data-time="900">Uzoq Tanaffus (15 daqiqa)</button>
        </div>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
            <button class="btn btn-success" id="start-btn"><i class="fa-solid fa-play"></i> Boshlash</button>
            <button class="btn btn-secondary" id="pause-btn"><i class="fa-solid fa-pause"></i> Pauza</button>
            <button class="btn btn-danger" id="reset-btn"><i class="fa-solid fa-rotate-left"></i> Qaytarish</button>
        </div>
        <div class="pomodoro-stats">
            <p>Bugungi yakunlangan sessiyalar: <strong id="session-count">0</strong> ta</p>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Pomodoro Ish Vaqti Taymeri</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
