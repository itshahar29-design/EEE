<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Drawing Canvas - Onlayn Doska</h1>
            <p class="project-badge"><i class="fa-solid fa-palette"></i> Dizayn & UI Asboblari</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 750px; margin: 0 auto; text-align: center;">
        <div style="display: flex; gap: 15px; justify-content: center; align-items: center; margin-bottom: 15px;">
            <input type="color" id="draw-color" value="#38bdf8" style="border: none; cursor: pointer; width: 40px; height: 40px;">
            <input type="range" id="draw-size" min="1" max="30" value="5">
            <button class="btn btn-danger" onclick="clearDraw()"><i class="fa-solid fa-trash"></i> Tozalash</button>
        </div>
        <canvas id="draw-canvas" width="680" height="380" style="background: #090d16; border: 2px solid #334155; border-radius: 8px; cursor: crosshair;"></canvas>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Drawing Canvas - Onlayn Doska</strong></p>
    </footer>
