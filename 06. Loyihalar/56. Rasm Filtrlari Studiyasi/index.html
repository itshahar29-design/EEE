<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Studio - CSS Filtrlari | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Image Filter Studio - CSS Filtrlari</h1>
            <p class="project-badge"><i class="fa-solid fa-palette"></i> Dizayn & UI Asboblari</p>
        </div>
    </header>

    <main class="project-main">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
        <div class="card">
            <label style="color: #94a3b8;">Yorqinlik (Brightness):</label>
            <input type="range" id="fl-bright" min="0" max="200" value="100" style="width: 100%; margin: 6px 0 12px;">
            <label style="color: #94a3b8;">Kontrast (Contrast):</label>
            <input type="range" id="fl-contrast" min="0" max="200" value="100" style="width: 100%; margin: 6px 0 12px;">
            <label style="color: #94a3b8;">Oq-qora (Grayscale):</label>
            <input type="range" id="fl-gray" min="0" max="100" value="0" style="width: 100%; margin: 6px 0 12px;">
            <label style="color: #94a3b8;">Sepia effekti:</label>
            <input type="range" id="fl-sepia" min="0" max="100" value="0" style="width: 100%; margin: 6px 0 12px;">
        </div>
        <div class="card" style="text-align: center;">
            <img id="fl-img" src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=400" alt="Studio" style="max-width: 100%; border-radius: 8px;">
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Image Filter Studio - CSS Filtrlari</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
