<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Vazifalar Doskasi | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Kanban Vazifalar Doskasi</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div class="kanban-header">
        <input type="text" id="task-input" placeholder="Yangi vazifa nomi..." class="kanban-input">
        <button class="btn btn-success" id="add-task-btn"><i class="fa-solid fa-plus"></i> Qo'shish</button>
    </div>
    <div class="kanban-board">
        <div class="kanban-col" id="col-todo">
            <h3><i class="fa-regular fa-clock"></i> Rejada (To Do)</h3>
            <div class="task-list" ondragover="allowDrop(event)" ondrop="drop(event, 'todo')"></div>
        </div>
        <div class="kanban-col" id="col-progress">
            <h3><i class="fa-solid fa-spinner"></i> Jarayonda (In Progress)</h3>
            <div class="task-list" ondragover="allowDrop(event)" ondrop="drop(event, 'progress')"></div>
        </div>
        <div class="kanban-col" id="col-done">
            <h3><i class="fa-solid fa-circle-check"></i> Bajarildi (Done)</h3>
            <div class="task-list" ondragover="allowDrop(event)" ondrop="drop(event, 'done')"></div>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Kanban Vazifalar Doskasi</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
