<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tana Massasi Indeksi (BMI) Hisoblagich | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Tana Massasi Indeksi (BMI) Hisoblagich</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
        <div style="margin-bottom: 15px; text-align: left;">
            <label style="color: #94a3b8; font-size: 13px;">Bo'yingiz (sm):</label>
            <input type="number" id="bmi-height" placeholder="175" style="width: 100%; padding: 12px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: white; margin-top: 5px;">
        </div>
        <div style="margin-bottom: 20px; text-align: left;">
            <label style="color: #94a3b8; font-size: 13px;">Vazningiz (kg):</label>
            <input type="number" id="bmi-weight" placeholder="70" style="width: 100%; padding: 12px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: white; margin-top: 5px;">
        </div>
        <button class="btn btn-success" style="width: 100%; justify-content: center;" onclick="calcBMI()">Hisoblash</button>
        <div id="bmi-result" style="margin-top: 25px; display: none;">
            <h1 id="bmi-val" style="color: #38bdf8; font-size: 48px;">22.5</h1>
            <p id="bmi-status" style="font-weight: 700; font-size: 18px; margin: 10px 0;">Normal vazn</p>
            <small style="color: #94a3b8;">Normal BMI ko'rsatkichi 18.5 dan 24.9 gacha hisoblanadi.</small>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Tana Massasi Indeksi (BMI) Hisoblagich</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
