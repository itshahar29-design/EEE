<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Oynalar (Popup Dialogs) | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Modal Oynalar (Popup Dialogs)</h1>
            <p class="project-badge"><i class="fa-solid fa-palette"></i> Dizayn & UI Asboblari</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
        <button class="btn btn-success" onclick="document.getElementById('demo-modal').style.display='flex'"><i class="fa-solid fa-window-maximize"></i> Modalni Ochish</button>
        <div id="demo-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 100;">
            <div style="background: #1e293b; padding: 30px; border-radius: 12px; max-width: 400px; text-align: center; border: 1px solid #334155;">
                <h3 style="color: #38bdf8; margin-bottom: 15px;">Salom, bu Modal Oyna!</h3>
                <p style="color: #94a3b8; margin-bottom: 20px;">Dasturchilar ogohlantirishlar va formalarda modal oynalardan foydalanadilar.</p>
                <button class="btn btn-danger" onclick="document.getElementById('demo-modal').style.display='none'">Yopish</button>
            </div>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Modal Oynalar (Popup Dialogs)</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
