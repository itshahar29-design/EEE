<!DOCTYPE html>
<html lang="uz">
<head>

    <title>Flexbox Playground | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Flexbox Playground</h1>
            <p class="project-badge"><i class="fa-solid fa-code"></i> Dasturchi Asboblari</p>
        </div>
    </header>

    <main class="project-main">
<div class="card"><div style="display:flex;gap:10px;margin-bottom:15px;"><button class="btn" onclick="document.getElementById('fx-box').style.justifyContent='flex-start'">Start</button><button class="btn" onclick="document.getElementById('fx-box').style.justifyContent='center'">Center</button><button class="btn" onclick="document.getElementById('fx-box').style.justifyContent='space-between'">Space-between</button></div><div id="fx-box" style="display:flex;height:180px;background:#090d16;border:1px solid #334155;border-radius:8px;padding:10px;gap:10px;"><div style="width:60px;height:60px;background:#ef4444;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;">1</div><div style="width:60px;height:60px;background:#3b82f6;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;">2</div><div style="width:60px;height:60px;background:#10b981;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;">3</div></div></div>
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Flexbox Playground</strong></p>
    </footer>

    <script src="./script.js"></script>
