<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tezkor CV & Rezyume Yaratuvchi | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Tezkor CV & Rezyume Yaratuvchi</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="card">
            <h3 style="margin-bottom: 15px; color: #38bdf8;">Ma'lumotlaringiz:</h3>
            <input type="text" id="cv-name" placeholder="Ism Familiya" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 10px;">
            <input type="text" id="cv-role" placeholder="Frontend Dasturchi" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 10px;">
            <input type="email" id="cv-email" placeholder="email@gmail.com" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 10px;">
            <textarea id="cv-about" placeholder="O'zingiz haqingizda qisqacha..." style="width: 100%; height: 80px; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 10px;"></textarea>
            <input type="text" id="cv-skills" placeholder="Ko'nikmalar (HTML, CSS, JS, React)" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 15px;">
            <button class="btn btn-success" onclick="window.print()"><i class="fa-solid fa-print"></i> Chop Etish (PDF)</button>
        </div>
        <div class="card" id="cv-preview" style="background: white; color: #1e293b; border-radius: 8px; padding: 25px;">
            <h1 id="prev-name" style="color: #0f172a; font-size: 24px;">Frontend Jamoasi</h1>
            <p id="prev-role" style="color: #0284c7; font-weight: bold; margin-bottom: 5px;">Senior Front-End Dasturchi</p>
            <p id="prev-email" style="color: #64748b; font-size: 13px; margin-bottom: 15px;">developer@example.com</p>
            <hr style="margin: 15px 0;">
            <h4 style="color: #0f172a; margin-bottom: 8px;">Men Haqimda:</h4>
            <p id="prev-about" style="font-size: 14px; line-height: 1.5; color: #475569; margin-bottom: 15px;">Front-End texnologiyalariga qiziqqan dasturchi.</p>
            <h4 style="color: #0f172a; margin-bottom: 8px;">Ko'nikmalar:</h4>
            <div id="prev-skills" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Tezkor CV & Rezyume Yaratuvchi</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
