<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism (Shisha Effekti) Generatori | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Glassmorphism (Shisha Effekti) Generatori</h1>
            <p class="project-badge"><i class="fa-solid fa-palette"></i> Dizayn & UI Asboblari</p>
        </div>
    </header>

    <main class="project-main">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
        <div class="card">
            <label style="color: #94a3b8;">Blur (px):</label>
            <input type="range" id="gm-blur" min="0" max="40" value="12" style="width: 100%; margin: 8px 0 16px;">
            <label style="color: #94a3b8;">Shaffoflik (%):</label>
            <input type="range" id="gm-op" min="0" max="100" value="25" style="width: 100%; margin: 8px 0 16px;">
        </div>
        <div class="card" style="background: linear-gradient(135deg, #0ea5e9, #ec4899); padding: 40px; display: flex; flex-direction: column; align-items: center;">
            <div id="gm-card" style="width: 220px; height: 140px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: white;">Shisha Karta</div>
            <textarea id="gm-code" readonly style="width: 100%; height: 90px; margin-top: 25px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: #38bdf8; font-family: monospace; padding: 8px;"></textarea>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Glassmorphism (Shisha Effekti) Generatori</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
