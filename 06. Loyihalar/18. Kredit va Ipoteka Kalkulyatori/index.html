<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kredit va Oylik To'lov Kalkulyatori | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Kredit va Oylik To'lov Kalkulyatori</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 550px; margin: 0 auto;">
        <div style="margin-bottom: 15px;">
            <label style="color: #94a3b8;">Kredit summasi (so'm):</label>
            <input type="number" id="loan-amount" value="50000000" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-top: 5px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="color: #94a3b8;">Yillik foiz stavkasi (%):</label>
            <input type="number" id="loan-rate" value="24" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-top: 5px;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="color: #94a3b8;">Muddati (oy):</label>
            <input type="number" id="loan-months" value="24" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-top: 5px;">
        </div>
        <button class="btn btn-success" style="width: 100%; justify-content: center;" onclick="calcLoan()">Hisoblash</button>
        <div style="margin-top: 25px; background: #0f172a; padding: 20px; border-radius: 8px; text-align: center;">
            <p style="color: #94a3b8;">Oylik to'lov:</p>
            <h2 id="monthly-pay" style="color: #10b981; font-size: 28px; margin: 5px 0;">0 so'm</h2>
            <p style="color: #94a3b8; margin-top: 10px;">Jami qaytariladigan summa: <strong id="total-pay" style="color: #38bdf8;">0 so'm</strong></p>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Kredit va Oylik To'lov Kalkulyatori</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
