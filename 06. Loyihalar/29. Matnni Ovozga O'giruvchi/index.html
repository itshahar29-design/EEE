<body>
    <header class="project-header">

    <main class="project-main">

    <div class="card" style="max-width: 600px; margin: 0 auto; text-align: center;">
        <textarea id="tts-input" placeholder="O'qib berish kerak bo'lgan matnni kiriting..." style="width: 100%; height: 160px; padding: 15px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 16px; outline: none; margin-bottom: 20px;">Salom do'stlar! Frontend Masterclass portaliga xush kelibsiz.</textarea>
        <div style="display: flex; justify-content: center; gap: 15px;">
            <button class="btn btn-success" onclick="speakText()"><i class="fa-solid fa-volume-high"></i> Ovozda O'qish</button>
            <button class="btn btn-danger" onclick="window.speechSynthesis.cancel()"><i class="fa-solid fa-stop"></i> To'xtatish</button>

    </div>
  
    </main>

    <footer class="project-footer">
