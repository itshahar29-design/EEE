<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Clip-Path Shakllar Generatori | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>CSS Clip-Path Shakllar Generatori</h1>
            <p class="project-badge"><i class="fa-solid fa-palette"></i> Dizayn & UI Asboblari</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 600px; margin: 0 auto; text-align: center;">
        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 25px;">
            <button class="btn btn-secondary" onclick="setClip('polygon(50% 0%, 0% 100%, 100% 100%)')">Uchburchak</button>
            <button class="btn btn-secondary" onclick="setClip('polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)')">Romb</button>
            <button class="btn btn-secondary" onclick="setClip('polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)')">Yulduz</button>
        </div>
        <div id="clip-box" style="width: 200px; height: 200px; background: #ec4899; margin: 0 auto 25px; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); transition: clip-path 0.3s;"></div>
        <input type="text" id="clip-val" readonly style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: #38bdf8; font-family: monospace;" value="clip-path: polygon(50% 0%, 0% 100%, 100% 100%);">
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>CSS Clip-Path Shakllar Generatori</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
