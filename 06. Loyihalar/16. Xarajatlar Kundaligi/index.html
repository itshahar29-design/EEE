<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Daromad va Xarajatlar | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Expense Tracker - Daromad va Xarajatlar</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 650px; margin: 0 auto;">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; text-align: center; margin-bottom: 25px;">
            <div style="background: #0f172a; padding: 15px; border-radius: 8px;">
                <p style="color: #94a3b8; font-size: 13px;">Umumiy Balans</p>
                <h3 id="total-balance" style="color: #38bdf8; font-size: 20px;">0 so'm</h3>
            </div>
            <div style="background: #0f172a; padding: 15px; border-radius: 8px;">
                <p style="color: #94a3b8; font-size: 13px;">Daromad (+)</p>
                <h3 id="total-income" style="color: #10b981; font-size: 20px;">0 so'm</h3>
            </div>
            <div style="background: #0f172a; padding: 15px; border-radius: 8px;">
                <p style="color: #94a3b8; font-size: 13px;">Xarajat (-)</p>
                <h3 id="total-expense" style="color: #ef4444; font-size: 20px;">0 so'm</h3>
            </div>
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
            <input type="text" id="exp-title" placeholder="Nomi (Masalan: Tushlik)" style="flex: 2; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white;">
            <input type="number" id="exp-amount" placeholder="Summa (so'mda)" style="flex: 1; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white;">
            <select id="exp-type" style="padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white;">
                <option value="expense">Xarajat (-)</option>
                <option value="income">Daromad (+)</option>
            </select>
            <button class="btn btn-success" onclick="addExpense()"><i class="fa-solid fa-plus"></i></button>
        </div>
        <div id="expense-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Expense Tracker - Daromad va Xarajatlar</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
