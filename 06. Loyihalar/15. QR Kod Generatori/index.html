<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tezkor QR Kod Generatori | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Tezkor QR Kod Generatori</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
        <input type="text" id="qr-input" placeholder="Havola yoki matn kiriting (https://...)" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #090d16; color: white; margin-bottom: 15px; outline: none;">
        <button class="btn btn-success" style="width: 100%; justify-content: center;" onclick="generateQR()"><i class="fa-solid fa-qrcode"></i> QR Kod Yaratish</button>
        <div id="qr-result" style="margin-top: 25px; display: none;">
            <img id="qr-img" src="" alt="QR Code" style="background: white; padding: 15px; border-radius: 12px; max-width: 220px;">
            <div style="margin-top: 15px;">
                <a id="qr-download" href="" download="qrcode.png" class="btn" style="text-decoration: none;"><i class="fa-solid fa-download"></i> Rasmni Yuklab Olish</a>
            </div>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Tezkor QR Kod Generatori</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
