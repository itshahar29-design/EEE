<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krestiki-Noliki (Tic-Tac-Toe) O'yini | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Krestiki-Noliki (Tic-Tac-Toe) O'yini</h1>
            <p class="project-badge"><i class="fa-solid fa-gamepad"></i> O'yin & Interaktiv</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 450px; margin: 0 auto; text-align: center;">
        <h2 id="ttt-status" style="color: #38bdf8; margin-bottom: 20px;">X o'yinchining navbati</h2>
        <div style="display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin-bottom: 20px;">
            <button class="ttt-cell" onclick="makeMove(0)"></button>
            <button class="ttt-cell" onclick="makeMove(1)"></button>
            <button class="ttt-cell" onclick="makeMove(2)"></button>
            <button class="ttt-cell" onclick="makeMove(3)"></button>
            <button class="ttt-cell" onclick="makeMove(4)"></button>
            <button class="ttt-cell" onclick="makeMove(5)"></button>
            <button class="ttt-cell" onclick="makeMove(6)"></button>
            <button class="ttt-cell" onclick="makeMove(7)"></button>
            <button class="ttt-cell" onclick="makeMove(8)"></button>
        </div>
        <button class="btn btn-danger" onclick="resetTTT()"><i class="fa-solid fa-rotate-left"></i> Yangidan Boshlash</button>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Krestiki-Noliki (Tic-Tac-Toe) O'yini</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
