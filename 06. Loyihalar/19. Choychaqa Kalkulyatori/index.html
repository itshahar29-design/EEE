<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator - Choychaqa va Taqsimot | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>Tip Calculator - Choychaqa va Taqsimot</h1>
            <p class="project-badge"><i class="fa-solid fa-rocket"></i> Real Portfolio Loyihasi</p>
        </div>
    </header>

    <main class="project-main">

    <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
        <div style="margin-bottom: 15px; text-align: left;">
            <label style="color: #94a3b8;">Umumiy hisob (so'm):</label>
            <input type="number" id="bill-amount" placeholder="250000" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-top: 5px;">
        </div>
        <div style="margin-bottom: 15px; text-align: left;">
            <label style="color: #94a3b8;">Choychaqa foizi (%):</label>
            <select id="tip-pct" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-top: 5px;">
                <option value="0.05">5% - Yaxshi</option>
                <option value="0.10" selected>10% - A'lo</option>
                <option value="0.15">15% - Super</option>
            </select>
        </div>
        <div style="margin-bottom: 20px; text-align: left;">
            <label style="color: #94a3b8;">Odamlar soni:</label>
            <input type="number" id="people-count" value="2" min="1" style="width: 100%; padding: 10px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: white; margin-top: 5px;">
        </div>
        <button class="btn btn-success" style="width: 100%; justify-content: center;" onclick="calcTip()">Hisoblash</button>
        <div style="margin-top: 20px; background: #0f172a; padding: 20px; border-radius: 8px;">
            <p style="color: #94a3b8;">Har bir kishi uchun summa:</p>
            <h2 id="per-person" style="color: #38bdf8; font-size: 32px; margin-top: 5px;">0 so'm</h2>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>Tip Calculator - Choychaqa va Taqsimot</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
