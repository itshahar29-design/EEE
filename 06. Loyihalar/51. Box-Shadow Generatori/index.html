<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box-Shadow Generatori | Real Loyiha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="project-header">
        <div class="header-content">
            <a href="../../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Portalga qaytish</a>
            <h1>CSS Box-Shadow Generatori</h1>
            <p class="project-badge"><i class="fa-solid fa-palette"></i> Dizayn & UI Asboblari</p>
        </div>
    </header>

    <main class="project-main">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
        <div class="card">
            <label style="color: #94a3b8;">X-surilish (px):</label>
            <input type="range" id="bs-x" min="-50" max="50" value="10" style="width: 100%; margin: 8px 0 16px;">
            <label style="color: #94a3b8;">Y-surilish (px):</label>
            <input type="range" id="bs-y" min="-50" max="50" value="10" style="width: 100%; margin: 8px 0 16px;">
            <label style="color: #94a3b8;">Blur (px):</label>
            <input type="range" id="bs-blur" min="0" max="100" value="25" style="width: 100%; margin: 8px 0 16px;">
            <label style="color: #94a3b8;">Spread (px):</label>
            <input type="range" id="bs-spread" min="-20" max="50" value="0" style="width: 100%; margin: 8px 0 16px;">
            <label style="color: #94a3b8;">Soya rangi:</label>
            <input type="color" id="bs-color" value="#000000" style="width: 100%; height: 40px; margin-top: 8px; border: none; cursor: pointer;">
        </div>
        <div class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div id="bs-preview" style="width: 180px; height: 180px; background: #38bdf8; border-radius: 12px; margin-bottom: 30px;"></div>
            <textarea id="bs-code" readonly style="width: 100%; height: 70px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: #38bdf8; font-family: monospace; padding: 10px;"></textarea>
            <button class="btn btn-success" style="margin-top: 15px;" onclick="copyBS()"><i class="fa-solid fa-copy"></i> CSS Nusxalash</button>
        </div>
    </div>
  
    </main>

    <footer class="project-footer">
        <p>Frontend 10X Portfeli &bull; <strong>CSS Box-Shadow Generatori</strong></p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
